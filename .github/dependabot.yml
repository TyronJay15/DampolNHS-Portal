# Weekly pull requests for outdated or vulnerable dependencies (security plan W14). Security updates are also
# raised as soon as GitHub learns of a vulnerability, once "Dependabot alerts" is on in the repository settings.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
